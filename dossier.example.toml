# Copy to $DOSSIER_DATA/dossier.toml to override defaults.
# That path is gitignored. Environment variables win over this file.
# Leave a key out to keep the built-in default.

# Global LLM investment: light | balanced | high
# balanced: extract on [llm] fast, ask on [llm] model.
# light: extract drafts only, ask exact, context 8192, timeout 120s.
# high: ask and extract on the answer model, ask rich, planner rich, timeout 600s.
# effort = "balanced"

# Default sources and years for ask, match, and brief.
# Leave sources out (or all = true) to search every registered source.
# A record with no Year header stays in when a range is set.
# [scope]
# all = true
# year_from = 2016
# year_to = 2024

# model overrides the answer model for that effort.
# fast overrides the fast model. Leave fast unset to keep [llm] fast,
# except high, which uses the answer model for both roles unless fast is set.
# [efforts.high]
# model = "qwen3.8:latest"

# Active prompt ids. Missing keys use the built-in of the same name.
# [prompts]
# ask = "ask"

[llm]
provider = "ollama" # ollama | litellm | off
model = "qwen3.8:latest" # ask and brief
fast = "qwen2.5:3b" # extract, employer filter, ask planner, letter arrange
embed_model = "nomic-embed-text"
base_url = "http://127.0.0.1:11434"
allow_remote = false # off. true permits a non-loopback Ollama host; the prompt may then leave
max_calls = 0 # 0 = unlimited; set a positive cap to stop early
timeout = 300 # seconds per Ollama generate call
# api_base = "https://example.invalid/v1"

[ask]
mode = "auto" # exact | auto | rich
limit = 5
fts = true
cards_first = true
passages = true
hops = 1
decompose = "auto" # off | auto | on
planner = "off" # off | rich
embed = true # cosine neighbors when `dossier index` has vectors
pubs = false # one /search per ask; hits are not written into the corpus

[tailor]
# name = "Your Name"

[identity]
# Slack ids, the names meetings should treat as you, and which mail
# folder holds each account. This block stays in the gitignored copy.
# slack_user_ids = ["U00000000"]
# speaker_names = ["Your Name"]
# Optional Twenty boolean on People. The field name stays in the environment,
# not in this repo: DOSSIER_TWENTY_COAUTHOR_FIELD. Leave it unset to skip.

# [identity.mail_accounts]
# "you@example.com" = "mail-folder"

[mail]
# Folder phrases. Leave these out and the built-in lists apply.
# A list adds phrases. The matching `_off` list turns built-in phrases off.
# Words and phrases, not regular expressions. Keep wins over exclude.
# exclude = ["promo"]
# exclude_off = ["amazon affiliate"]
# keep = ["little blue letter"]
# keep_off = ["finance"]
# activity = ["coaching"]
# activity_off = ["mcs"]
# signals = ["promotion"]
# signals_off = ["signup"]
# closed_off = ["trash"]

[names]
# File and subject words, shared by mail, Slack, and employer lists.
# drop wins over keep. keep wins over exclude.
# drop = ["ticket restaurant"]
# drop_off = ["timesheet"]
# keep = ["per diem"]
# keep_off = ["frais"]
# exclude = ["newsletter"]
# exclude_off = ["form"]

[slack]
# Channel phrases. Activity is the built-in sample list (gsr_, research_, …).
# exclude drops a channel from every Slack hunt. Same add / _off rules as mail.
# activity = ["coaching_"]
# activity_off = ["policy"]
# exclude = ["random"]

[meetings]
# exclude skips a directory name. solo is the kinds kept when you are the only speaker.
# exclude = ["holding"]
# exclude_off = ["metadata"]
# solo = ["briefing"]
# solo_off = ["slides"]

[employer]
# paths = ["/absolute/path/to/one/employer/folder"]
filter = true # skip caches, junk types, and older copies of the same file
# dir_exclude = ["scratch"]
# dir_exclude_off = ["cache"]
# suffix_exclude_off = [".png"]
# file_exclude = ["notes.lock"]
# roots = ["briefs"]          # career-list folders, added to publications/events/projects/slides
# roots_off = ["slides"]
# slug_exclude_off = ["admin"] # an employer folder named admin can be listed
# exclude = ["scratch-notes"]  # path phrase dropped at ingest
filter_llm = true # when the provider is on, one pass over folder names
filter_llm_calls = 4 # own cap; does not spend DOSSIER_LLM_MAX_CALLS

[git]
# user = "your-git-author"
# paths = ["/absolute/path/to/one/repo"]
# exclude = ["wip"]

# The same exclude / exclude_off pair exists for chatgpt, linkedin, transcripts,
# pubs, and applications. applications also has file_exclude for junk names.
# Cap kept files with DOSSIER_APPLICATIONS_MAX_FILES (default 2000).
# [chatgpt]
# exclude = ["scratch"]

[extract]
llm = true
chunk_chars = 4000 # max chars per LLM extract window
max_chunks = 4 # cap LLM calls per record

[run]
adapters = [] # empty: every detected adapter
pack = "career"
# posting = "/absolute/path/to/posting.txt"

# Retrieval expansions. When this key is absent, built-in lens words
# (delivered, skills, contributions, publications, roles) expand on their own.
# An empty list turns those extras off. A list replaces them.
# lexicon = ["workshop", "brief"]

[pubs]
# Bibliography for briefs. Ingest reads this collection from zotero.sqlite.
# Other collections are left alone. PDFs are not parsed.
# collection = "your-zotero-collection"
# zotero_db = "/absolute/path/to/zotero.sqlite"
# Optional loopback /search when collection is unset. A remote host is not contacted.
# seed = "publications"
# top_k = 50
# url = "http://127.0.0.1:8012"
