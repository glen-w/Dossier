# Copy to $DOSSIER_DATA/dossier.toml to override defaults.
# That path is gitignored. Environment variables win over this file.
# Leave a key out to keep the built-in default.

[llm]
provider = "ollama" # ollama | litellm | off
model = "qwen3.8:latest"
embed_model = "nomic-embed-text"
base_url = "http://127.0.0.1:11434"
allow_remote = false
max_calls = 0 # 0 = unlimited; set a positive cap to stop early
timeout = 300 # seconds per Ollama generate call
# api_base = "https://example.invalid/v1"

[ask]
mode = "auto" # exact | auto | rich
limit = 5
fts = true
cards_first = true
passages = true
hops = 1
decompose = "auto" # off | auto | on
planner = "off" # off | rich
embed = true # cosine neighbors when `dossier index` has vectors
pubs = false # one /search per ask; hits are not written into the corpus

[tailor]
# name = "Your Name"

[employer]
# paths = ["/absolute/path/to/one/employer/folder"]
filter = true # skip caches, junk types, and older copies of the same file
filter_llm = true # when the provider is on, one pass over folder names
filter_llm_calls = 4 # own cap; does not spend DOSSIER_LLM_MAX_CALLS

[git]
# user = "your-git-author"
# paths = ["/absolute/path/to/one/repo"]

[extract]
llm = true
chunk_chars = 4000 # max chars per LLM extract window
max_chunks = 4 # cap LLM calls per record

[run]
adapters = [] # empty: every detected adapter
pack = "career"
# posting = "/absolute/path/to/posting.txt"

# Retrieval expansions. When this key is absent, built-in lens words
# (delivered, skills, contributions, publications, roles) expand on their own.
# An empty list turns those extras off. A list replaces them.
# lexicon = ["workshop", "brief"]

[pubs]
# Own-pubs HTTP retrieve (sibling zotero-rag-pubs). Live ingest stays gated.
# collection = "your-zotero-collection"
# seed = "publications"
# top_k = 50
# url = "http://127.0.0.1:8012"
# zotero_db = "/absolute/path/to/zotero.sqlite"
