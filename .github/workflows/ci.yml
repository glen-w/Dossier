name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync
        run: uv sync --extra dev --extra web --extra vec --extra render --extra office
      - name: FTS5
        run: |
          uv run python -c "import sqlite3; c=sqlite3.connect(':memory:'); c.execute('create virtual table t using fts5(x)')"
      - name: Ruff
        run: uv run ruff check src tests scripts
      - name: Mypy
        run: uv run mypy src/dossier
      - name: Gitignore shape
        run: python3 scripts/release/check_gitignore.py
      - name: Tests
        run: uv run pytest --cov=src/dossier --cov-report=term-missing -q

  wheel:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Build
        run: |
          rm -rf dist
          uv build --wheel
      - name: Install the wheel in a clean environment
        shell: bash
        run: |
          uv venv /tmp/wheel-env
          wheels=(dist/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "expected one wheel in dist/, got ${#wheels[@]}"
            ls -la dist || true
            exit 1
          fi
          uv pip install --python /tmp/wheel-env/bin/python "${wheels[0]}[web,render,office,vec]"
      - name: Bundled files ship in the wheel
        run: |
          /tmp/wheel-env/bin/python - <<'PY'
          from importlib.resources import files
          pkg = files("dossier")
          for name in ("eval_set.json", "fonts/DejaVuSans.ttf", "fonts/LICENSE-DejaVu.txt"):
              assert (pkg / name).is_file(), name
          PY
      - name: Doctor, golden eval, and a PDF from the installed wheel
        run: |
          export DOSSIER_DATA="$(mktemp -d)" DOSSIER_LLM_PROVIDER=off
          /tmp/wheel-env/bin/dossier doctor
          /tmp/wheel-env/bin/dossier eval --retrieval
      - name: Second machine
        run: bash scripts/release/second_machine.sh

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Audit locked dependencies
        run: uvx pip-audit --requirement <(uv export --no-hashes --all-extras --no-emit-project 2>/dev/null)
