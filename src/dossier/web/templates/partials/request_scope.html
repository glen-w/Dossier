<fieldset class="phrase-list">
  <legend>This request</legend>
  <p class="meta">Starts from Settings. Changes here stay on this request.</p>
  <input type="hidden" name="scope_form" value="1">
  <div class="checks">
    {% for name in scope_names %}
    <label>
      <input type="checkbox" name="sources" value="{{ name }}" {% if name in scope_selected %}checked{% endif %}>
      {{ name }}
    </label>
    {% endfor %}
  </div>
  <div class="row">
    <label class="field">Year from
      <input name="year_from" inputmode="numeric" placeholder="any" value="{{ scope_year_from }}">
    </label>
    <label class="field">Year to
      <input name="year_to" inputmode="numeric" placeholder="any" value="{{ scope_year_to }}">
    </label>
    <label class="field">Effort
      <select name="effort">
        <option value="">use settings ({{ cfg.effort }})</option>
        {% for name in efforts %}
        <option value="{{ name }}">{{ name }}</option>
        {% endfor %}
      </select>
    </label>
  </div>
</fieldset>
