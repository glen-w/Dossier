[project]
name = "dossier"
version = "0.4.0"
description = "Local-first work-evidence locker and RAG"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Glen" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "duckdb>=1.1",
]

[project.optional-dependencies]
llm = ["litellm>=1.70,<2"]
dev = ["pytest>=8"]

[project.scripts]
dossier = "dossier.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dossier"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
