[project]
name = "dossier"
version = "0.9.0"
description = "Local-first work-evidence locker and RAG"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Glen" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "duckdb>=1.1",
]

[project.optional-dependencies]
llm = ["litellm>=1.70,<2"]
office = ["pypdf>=5"]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.0",
]
dev = ["pytest>=8", "httpx>=0.27"]
docs = [
    "sphinx>=7.0.0",
    "myst-parser>=2.0.0",
    "furo>=2023.9.10",
    "sphinx-autobuild>=2021.3.14",
    "sphinxcontrib-mermaid>=0.9.2",
    "sphinx-autodoc-typehints>=1.24.0",
]

[project.scripts]
dossier = "dossier.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dossier"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
