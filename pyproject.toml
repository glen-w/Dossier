[project]
name = "dossier"
dynamic = ["version"]
description = "Local-first work-evidence locker and RAG"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Dossier contributors" }]
requires-python = ">=3.11"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Private :: Do Not Upload",
]
dependencies = [
    "httpx>=0.27",
    "duckdb>=1.1",
]

[project.optional-dependencies]
llm = ["litellm>=1.70,<2"]
office = ["pypdf>=5"]
web = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.0",
]
vec = ["sqlite-vec>=0.1"]
render = ["fpdf2>=2.8"]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4",
    "pypdf>=5",
]
docs = [
    "sphinx>=7.0.0",
    "myst-parser>=2.0.0",
    "furo>=2023.9.10",
    "sphinx-autobuild>=2021.3.14",
    "sphinxcontrib-mermaid>=0.9.2",
    "sphinx-autodoc-typehints>=1.24.0",
]

[project.scripts]
dossier = "dossier.cli:main"

[project.urls]
Homepage = "https://github.com/glen-w/Dossier"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/dossier/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dossier"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.hypothesis",
    "/.pytest_cache",
    "/.ruff_cache",
    "/.mypy_cache",
    "/.venv",
    "/dist",
    "/build",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["dossier"]
omit = ["*/web/static/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "BLE", "TRY", "RUF"]
ignore = [
    "E501",
    "E402",
    "TRY003",
    "TRY004",
    "TRY300",
    "TRY301",
    "RUF005",
    "RUF012",
    "RUF001",
    "RUF002",
    "RUF003",
    "SIM103",
    "SIM105",
    "SIM108",
    "SIM117",
    "B905",
    "BLE001",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["BLE001", "TRY002", "B008"]
"scripts/**" = ["BLE001"]
"src/dossier/web/app.py" = ["B008"]
"src/dossier/web/routers/**" = ["B008"]
"src/dossier/fetch/mbox.py" = ["SIM118"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false
# Ratchet: each code removed here is enforced. union-attr and arg-type remain.
disable_error_code = [
    "union-attr",
    "arg-type",
]
packages = ["dossier"]
